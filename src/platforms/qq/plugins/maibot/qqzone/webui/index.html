<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QQ动态 · MaiBot</title>
  <style>
    :root{color-scheme:dark;--bg:#0c1018;--panel:#151b26;--panel2:#1c2432;--line:#2b3546;--text:#edf2f8;--muted:#98a6b9;--brand:#62d0ff;--brand2:#8e7cff;--ok:#6ee7a7;--warn:#ffc56e;--bad:#ff7f8c;--shadow:0 16px 45px #0006}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#273258 0,transparent 34%),radial-gradient(circle at 0 30%,#12364a 0,transparent 28%),var(--bg);color:var(--text);font:14px/1.55 ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;min-height:100vh}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{width:min(1180px,calc(100% - 28px));margin:auto;padding:26px 0 64px}.top{display:flex;align-items:center;gap:16px;margin-bottom:22px}.back{color:var(--muted);text-decoration:none}.back:hover{color:var(--text)}h1{font-size:28px;margin:0}.subtitle{color:var(--muted);margin-left:auto}.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(310px,.8fr);gap:18px}.panel{background:linear-gradient(145deg,#171e2aee,#111722ee);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.panel-head h2{font-size:16px;margin:0}.panel-body{padding:20px}.status{display:flex;align-items:center;gap:9px}.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 10px currentColor}.dot.ok{background:var(--ok)}.pill{border:1px solid var(--line);border-radius:999px;color:var(--muted);padding:4px 9px;font-size:12px}.controls{display:grid;grid-template-columns:minmax(180px,1fr) 88px auto;gap:10px;margin-bottom:18px}input,select,textarea{width:100%;border:1px solid var(--line);background:#0f1520;color:var(--text);border-radius:10px;padding:10px 12px;outline:none}textarea{min-height:100px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--brand)}button{border:0;border-radius:10px;background:linear-gradient(120deg,var(--brand),var(--brand2));color:#081018;font-weight:700;padding:10px 15px}button.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}button.danger{background:#391d27;color:#ffb0ba;border:1px solid #68303c}button:disabled{opacity:.45;cursor:not-allowed}.feeds{display:grid;gap:12px}.feed{border:1px solid var(--line);background:#101721;border-radius:14px;padding:16px}.feed-top{display:flex;gap:11px;align-items:center}.avatar{width:40px;height:40px;border-radius:50%;background:#263247;object-fit:cover}.avatar-fallback{display:grid;place-items:center;color:var(--brand);font-weight:800}.who{font-weight:700}.time{font-size:12px;color:var(--muted)}.content{white-space:pre-wrap;margin:13px 0;word-break:break-word}.meta{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px}.feed-actions{display:flex;gap:8px;margin-left:auto}.feed-actions button{font-size:12px;padding:7px 11px}.comment-box{display:none;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.comment-box.open{display:grid}.stack{display:grid;gap:18px}.form-row{display:grid;gap:8px;margin-bottom:14px}.form-row label{color:var(--muted);font-size:12px}.inline{display:flex;gap:8px}.inline>*{flex:1}.history{display:grid;gap:9px;max-height:270px;overflow:auto}.history-item{border-bottom:1px solid var(--line);padding:0 0 9px}.history-item:last-child{border:0}.history-item small{color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:46px 12px}.notice{padding:11px 13px;border-radius:10px;background:#102735;color:#acdff4;margin-bottom:14px}.notice.warn{background:#352818;color:#ffd79a}.toast{position:fixed;right:22px;bottom:22px;background:#202a39;border:1px solid var(--line);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s}.toast.show{transform:none;opacity:1}.toast.bad{color:#ffafb7}.loading{opacity:.55;pointer-events:none}.muted{color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}.subtitle{display:none}}@media(max-width:570px){.shell{width:min(100% - 18px,1180px)}.controls{grid-template-columns:1fr 80px}.controls button{grid-column:1/-1}.feed-actions{width:100%;margin:10px 0 0}.feed-top{flex-wrap:wrap}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><a class="back" href="/">← 管理面板</a><h1>QQ动态</h1><span class="pill">ATRI</span><span class="subtitle">好友空间 · 人工确认写操作 · 记忆驱动草稿</span></header>
  <div class="grid">
    <section class="panel">
      <div class="panel-head"><h2>好友动态</h2><div class="status"><i id="statusDot" class="dot"></i><span id="statusText">连接检查中</span></div><span id="feedCount" class="pill">0 条</span></div>
      <div class="panel-body">
        <div id="bridgeNotice" class="notice warn" hidden></div>
        <div class="controls">
          <select id="personSelect"><option value="">全部好友动态</option></select>
          <select id="limitSelect"><option>10</option><option selected>20</option><option>30</option><option>50</option></select>
          <button id="refreshBtn">刷新动态</button>
        </div>
        <div class="inline direct-person"><input id="personInput" inputmode="numeric" maxlength="20" placeholder="好友不在列表？输入 QQ 号直接读取"><button id="readPersonBtn" class="secondary">读取此好友</button><button id="refreshFriendsBtn" class="secondary">刷新好友列表</button></div>
        <div id="feeds" class="feeds"><div class="empty">正在载入动态…</div></div>
      </div>
    </section>
    <aside class="stack">
      <section class="panel">
        <div class="panel-head"><h2>亚托莉发布</h2><span id="autoStatus" class="pill">自主发布关闭</span></div>
        <div class="panel-body">
          <div class="notice">“生成草稿”会读取近期聊天记忆与情绪提示；发布前仍由你编辑并确认。</div>
          <div class="form-row"><label for="topic">这一刻的主题（可选）</label><input id="topic" maxlength="200" placeholder="例如：雨后的傍晚"></div>
          <div class="inline" style="margin-bottom:14px"><button id="generateBtn" class="secondary">生成草稿</button><select id="visibility"><option value="1">好友可见</option><option value="0">所有人可见</option><option value="2">仅自己可见</option></select></div>
          <div class="form-row"><label for="postContent">动态内容</label><textarea id="postContent" maxlength="1000" placeholder="让亚托莉说点什么…"></textarea><small id="draftMeta" class="muted">尚未生成草稿</small></div>
          <button id="postBtn" style="width:100%">确认发布</button>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>自主发布配置</h2><span id="scheduleStatus" class="pill">未保存</span></div>
        <div class="panel-body settings-form">
          <div class="inline"><label class="switch"><input id="autoEnabled" type="checkbox"><span>允许亚托莉自动发布</span></label><select id="autoVisibility"><option value="1">好友可见</option><option value="0">所有人可见</option><option value="2">仅自己可见</option></select></div>
          <div class="inline"><div class="form-row"><label>发布小时（逗号分隔）</label><input id="scheduleHours" placeholder="9,18,22"></div><div class="form-row"><label>分钟</label><input id="scheduleMinute" type="number" min="0" max="59"></div><div class="form-row"><label>最短间隔（分钟）</label><input id="minInterval" type="number" min="30"></div></div>
          <div class="inline"><div class="form-row"><label>每日最多发布</label><input id="dailyLimit" type="number" min="1" max="20"></div><div class="form-row"><label>时区</label><input id="timezone" placeholder="Asia/Shanghai"></div><div class="form-row"><label>生成温度</label><input id="generationTemperature" type="number" min="0" max="2" step="0.1"></div><div class="form-row"><label>最大输出 Token</label><input id="generationMaxTokens" type="number" min="64" max="1000"></div></div>
          <div class="form-row"><label>默认主题（定时发布时使用）</label><input id="topicPrompt" maxlength="200" placeholder="例如：今天的小确幸、季节变化"></div>
          <div class="form-row"><label>额外内容要求</label><textarea id="contentPrompt" maxlength="500" placeholder="例如：自然口语，控制在两句话，不提及聊天对象"></textarea></div>
          <div class="form-row"><label>情绪提示</label><input id="moodHint" maxlength="500" placeholder="留空则由近期记忆推断"></div>
          <button id="saveSettingsBtn" style="width:100%">保存并立即生效</button>
          <button id="autoPostNowBtn" class="secondary" style="width:100%">立即让亚托莉生成并发布</button>
          <div id="scheduleMeta" class="muted">尚未读取配置</div>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>自主点赞与评论</h2><span id="interactionStatus" class="pill">自主互动关闭</span></div>
        <div class="panel-body settings-form">
          <div class="inline"><label class="switch"><input id="interactionsEnabled" type="checkbox"><span>允许定时自主互动</span></label><label class="switch"><input id="autoLikeEnabled" type="checkbox"><span>自动点赞</span></label><label class="switch"><input id="autoCommentEnabled" type="checkbox"><span>自动评论</span></label></div>
          <div class="inline"><div class="form-row"><label>互动小时（逗号分隔）</label><input id="interactionHours" placeholder="10,19"></div><div class="form-row"><label>分钟</label><input id="interactionMinute" type="number" min="0" max="59"></div><div class="form-row"><label>最短间隔（分钟）</label><input id="interactionInterval" type="number" min="30"></div></div>
          <div class="inline"><div class="form-row"><label>每次最多点赞</label><input id="maxLikes" type="number" min="0" max="20"></div><div class="form-row"><label>每次最多评论</label><input id="maxComments" type="number" min="0" max="10"></div><div class="form-row"><label>读取动态数量</label><input id="interactionFeedLimit" type="number" min="1" max="50"></div></div>
          <div class="form-row"><label>评论风格与限制</label><textarea id="commentPrompt" maxlength="500" placeholder="友善、简短；不涉及隐私"></textarea></div>
          <div class="form-row"><label>忽略的 QQ 号（逗号或换行分隔）</label><textarea id="ignoredUserIds" maxlength="2000" placeholder="例如：10001,10002"></textarea></div>
          <button id="interactNowBtn" class="secondary" style="width:100%">立即让亚托莉判断并执行点赞/评论</button>
          <div id="interactionMeta" class="muted">尚未读取配置</div>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>最近操作</h2></div>
        <div class="panel-body"><div id="history" class="history"><span class="muted">暂无记录</span></div></div>
      </section>
    </aside>
  </div>
</main>
<div id="toast" class="toast"></div>
<script>
const API='/api/webui/qqzone';
const state={friends:[],feeds:[],draftId:null};
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
function toast(message,bad=false){const el=$('toast');el.textContent=message;el.className='toast show'+(bad?' bad':'');clearTimeout(el.timer);el.timer=setTimeout(()=>el.className='toast',2600)}
async function call(path,options={}){const response=await fetch(API+path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.detail||`请求失败 (${response.status})`);return data}
function setBusy(el,busy,label){el.disabled=busy;el.dataset.label??=el.textContent;el.textContent=busy?label:el.dataset.label}
function avatar(friend,feed){const url=friend?.avatar||'';return url?`<img class="avatar" src="${esc(url)}" alt="" referrerpolicy="no-referrer">`:`<span class="avatar avatar-fallback">${esc((feed.nickname||'Q')[0])}</span>`}
function renderFeeds(){const root=$('feeds');$('feedCount').textContent=`${state.feeds.length} 条`;if(!state.feeds.length){root.innerHTML='<div class="empty">没有读取到动态。可切换人物或稍后刷新。</div>';return}root.innerHTML=state.feeds.map((f,i)=>{const friend=state.friends.find(x=>x.user_id===String(f.user_id));return `<article class="feed"><div class="feed-top">${avatar(friend,f)}<div><div class="who">${esc(f.nickname||friend?.nickname||f.user_id)}</div><div class="time">${esc(f.time_text||formatTime(f.abstime))} · QQ ${esc(f.user_id)}</div></div><div class="feed-actions"><button class="secondary" data-like="${i}" ${f.liked?'disabled':''}>${f.liked?'已赞':'♡ 点赞'}</button><button class="secondary" data-comment="${i}">评论</button></div></div><div class="content">${esc(f.content||'[无文字内容]')}</div><div class="meta"><span>♡ ${Number(f.like_count||0)}</span><span>评论 ${Number(f.comment_count||0)}</span>${f.image_count?`<span>图片 ${Number(f.image_count)}</span>`:''}</div><div class="comment-box" id="comment-${i}"><input maxlength="500" placeholder="输入评论内容"><button data-send-comment="${i}">发送</button></div></article>`}).join('')}
function formatTime(sec){if(!sec)return '时间未知';return new Date(Number(sec)*1000).toLocaleString('zh-CN',{hour12:false})}
function applySettings(data){const p=data.proactive||{};$('autoEnabled').checked=!!p.enabled;$('autoVisibility').value=String(data.default_visibility??1);$('scheduleHours').value=p.schedule_hours||'9,18,22';$('scheduleMinute').value=Number(p.schedule_minute??0);$('minInterval').value=Number(p.minimum_interval_minutes??360);$('dailyLimit').value=Number(p.daily_limit??2);$('timezone').value=p.timezone||'Asia/Shanghai';$('topicPrompt').value=p.topic_prompt||'';$('contentPrompt').value=p.content_prompt||'';$('moodHint').value=p.mood_hint||'';$('generationTemperature').value=Number(p.generation_temperature??0.8);$('generationMaxTokens').value=Number(p.generation_max_tokens??300);$('scheduleStatus').textContent=p.enabled?'自动发布已开启':'自动发布关闭';const last=p.last_post_at?`上次发送：${new Date(Number(p.last_post_at)*1000).toLocaleString('zh-CN',{hour12:false})}`:'尚无发送记录';const next=p.next_schedule_at?`下次检查：${new Date(p.next_schedule_at).toLocaleString('zh-CN',{hour12:false})}`:'未计算';$('scheduleMeta').textContent=`${last} · ${next} · 每日 ${p.daily_limit??2} 条 · ${p.timezone||'Asia/Shanghai'}`;$('interactionsEnabled').checked=!!p.interactions_enabled;$('autoLikeEnabled').checked=p.auto_like_enabled!==false;$('autoCommentEnabled').checked=p.auto_comment_enabled!==false;$('interactionHours').value=p.interaction_schedule_hours||'10,19';$('interactionMinute').value=Number(p.interaction_schedule_minute??30);$('interactionInterval').value=Number(p.interaction_minimum_interval_minutes??180);$('maxLikes').value=Number(p.max_likes_per_run??3);$('maxComments').value=Number(p.max_comments_per_run??1);$('interactionFeedLimit').value=Number(p.interaction_feed_limit??20);$('commentPrompt').value=p.comment_prompt||'';$('ignoredUserIds').value=(p.ignored_user_ids||[]).join(',');$('interactionStatus').textContent=p.interactions_enabled?'自主互动已开启':'自主互动关闭';const lastInteraction=p.last_interaction_at?`上次互动：${new Date(Number(p.last_interaction_at)*1000).toLocaleString('zh-CN',{hour12:false})}`:'尚无互动记录';const nextInteraction=p.next_interaction_at?`下次检查：${new Date(p.next_interaction_at).toLocaleString('zh-CN',{hour12:false})}`:'未计算';$('interactionMeta').textContent=`${lastInteraction} · ${nextInteraction} · 今日点赞 ${p.today_likes??0} · 评论 ${p.today_comments??0}`}
function renderPeople(memoryPeople=[]){const merged=new Map();for(const f of state.friends)merged.set(String(f.user_id),{...f,source:'好友'});for(const p of memoryPeople){const id=String(p.user_id||'').trim();if(!/^\d{5,20}$/.test(id))continue;const old=merged.get(id)||{};merged.set(id,{...old,user_id:id,nickname:p.person_name||p.nickname||old.nickname||`QQ ${id}`,source:'记忆'})}state.friends=[...merged.values()];$('personSelect').innerHTML='<option value="">全部好友动态</option>'+state.friends.map(f=>`<option value="${esc(f.user_id)}">${esc(f.nickname||f.remark||f.user_id)} · ${esc(f.source)}</option>`).join('')}
function renderHistory(items=[]){$('history').innerHTML=items.length?items.map(x=>`<div class="history-item"><b>${esc({like:'点赞',comment:'评论',post:'发布'}[x.action]||x.action)}</b> <span class="pill">${esc(x.status)}</span><div>${esc(x.content||x.tid||'')}</div><small>${new Date(Number(x.created_at||0)*1000).toLocaleString('zh-CN',{hour12:false})} · ${esc(x.source)}</small></div>`).join(''):'<span class="muted">暂无记录</span>'}
async function loadDashboard(){try{const [data,peopleResult]=await Promise.all([call('/dashboard'),fetch('/api/webui/person/list?page=1&page_size=100&platform=qq',{credentials:'same-origin'}).then(r=>r.ok?r.json():{data:[]}).catch(()=>({data:[]}))]);const status=data.status||{},proactive=data.proactive||{};$('statusDot').classList.toggle('ok',!!status.connected);$('statusText').textContent=status.connected?`已连接${status.qq?' · '+status.qq:''}`:'未连接';$('bridgeNotice').hidden=!!status.connected;$('bridgeNotice').textContent=status.error||'请在插件配置中启用并连接 onebot-qzone。';state.friends=data.friends||[];renderPeople(peopleResult.data||[]);renderHistory(data.actions||[]);$('autoStatus').textContent=proactive.enabled?'自主发布已开启':'自主发布关闭';$('visibility').value=String(data.default_visibility??1);$('postContent').maxLength=Number(data.post_max_chars||1000);applySettings(data)}catch(error){$('statusText').textContent='插件不可用';$('bridgeNotice').hidden=false;$('bridgeNotice').textContent=error.message;toast(error.message,true)}}
async function refreshFeeds(userOverride=''){const btn=$('refreshBtn');const userId=(userOverride||$('personInput').value.trim()||$('personSelect').value||'').trim();setBusy(btn,true,'读取中…');$('feeds').classList.add('loading');try{const data=await call('/feeds',{method:'POST',body:JSON.stringify({user_id:userId,limit:Number($('limitSelect').value)})});state.feeds=data.feeds||[];renderFeeds()}catch(error){$('feeds').innerHTML=`<div class="empty">${esc(error.message)}</div>`;toast(error.message,true)}finally{setBusy(btn,false);$('feeds').classList.remove('loading')}}
async function likeFeed(index,button){const f=state.feeds[index];if(!confirm(`确认以机器人账号点赞 ${f.nickname||f.user_id} 的这条动态？`))return;setBusy(button,true,'处理中…');try{await call('/like',{method:'POST',body:JSON.stringify({user_id:String(f.user_id),tid:String(f.tid)})});f.liked=true;f.like_count=Number(f.like_count||0)+1;renderFeeds();toast('点赞成功');loadDashboard()}catch(error){setBusy(button,false);toast(error.message,true)}}
async function sendComment(index,button){const f=state.feeds[index],input=$(`comment-${index}`).querySelector('input'),content=input.value.trim();if(!content)return toast('请先输入评论',true);if(!confirm(`确认评论：${content}`))return;setBusy(button,true,'发送中…');try{await call('/comment',{method:'POST',body:JSON.stringify({user_id:String(f.user_id),tid:String(f.tid),content})});f.comment_count=Number(f.comment_count||0)+1;renderFeeds();toast('评论成功');loadDashboard()}catch(error){setBusy(button,false);toast(error.message,true)}}
async function generateDraft(){const btn=$('generateBtn');setBusy(btn,true,'回忆中…');try{const data=await call('/generate',{method:'POST',body:JSON.stringify({topic:$('topic').value.trim()})});$('postContent').value=data.content||'';state.draftId=data.draft_id||null;$('draftMeta').textContent=`情绪：${data.mood||'平静'} · 草稿 #${state.draftId||'-'}`;toast('草稿已生成，请检查后发布')}catch(error){toast(error.message,true)}finally{setBusy(btn,false)}}
async function publish(){const content=$('postContent').value.trim();if(!content)return toast('动态内容不能为空',true);if(!confirm(`将以机器人账号发布：\n\n${content}`))return;const btn=$('postBtn');setBusy(btn,true,'发布中…');try{await call('/post',{method:'POST',body:JSON.stringify({content,visibility:Number($('visibility').value),draft_id:state.draftId})});$('postContent').value='';state.draftId=null;$('draftMeta').textContent='发布成功';toast('QQ动态已发布');loadDashboard();refreshFeeds()}catch(error){toast(error.message,true)}finally{setBusy(btn,false)}}
async function saveSettings(){const btn=$('saveSettingsBtn');setBusy(btn,true,'保存中…');try{await call('/settings',{method:'PUT',body:JSON.stringify({enabled:$('autoEnabled').checked,schedule_hours:$('scheduleHours').value.trim(),schedule_minute:Number($('scheduleMinute').value||0),timezone:$('timezone').value.trim(),minimum_interval_minutes:Number($('minInterval').value||360),daily_post_limit:Number($('dailyLimit').value||2),default_visibility:Number($('autoVisibility').value),topic_prompt:$('topicPrompt').value.trim(),content_prompt:$('contentPrompt').value.trim(),mood_hint:$('moodHint').value.trim(),generation_temperature:Number($('generationTemperature').value||0.8),generation_max_tokens:Number($('generationMaxTokens').value||300),interactions_enabled:$('interactionsEnabled').checked,auto_like_enabled:$('autoLikeEnabled').checked,auto_comment_enabled:$('autoCommentEnabled').checked,interaction_schedule_hours:$('interactionHours').value.trim(),interaction_schedule_minute:Number($('interactionMinute').value||30),interaction_minimum_interval_minutes:Number($('interactionInterval').value||180),max_likes_per_run:Number($('maxLikes').value||0),max_comments_per_run:Number($('maxComments').value||0),interaction_feed_limit:Number($('interactionFeedLimit').value||20),comment_prompt:$('commentPrompt').value.trim(),ignored_user_ids:$('ignoredUserIds').value.split(/[\s,，]+/).map(x=>x.trim()).filter(x=>/^\d{5,20}$/.test(x))})})});$('scheduleStatus').textContent=$('autoEnabled').checked?'自动发布已开启':'自动发布关闭';$('interactionStatus').textContent=$('interactionsEnabled').checked?'自主互动已开启':'自主互动关闭';toast('配置已保存并立即生效');loadDashboard()}catch(error){toast(error.message,true)}finally{setBusy(btn,false)}}
async function autopostNow(){if(!confirm('确认让亚托莉根据近期记忆生成并立即发布一条动态？'))return;const btn=$('autoPostNowBtn');setBusy(btn,true,'生成并发布中…');try{const data=await call('/autopost',{method:'POST',body:JSON.stringify({topic:$('topicPrompt').value.trim(),confirm:true})});toast(`已发布：${data.content||''}`);loadDashboard();refreshFeeds()}catch(error){toast(error.message,true)}finally{setBusy(btn,false)}}
async function interactNow(){if(!confirm('确认让亚托莉读取好友动态，并自动执行她判断合适的点赞和评论？'))return;const btn=$('interactNowBtn');setBusy(btn,true,'判断并执行中…');try{const data=await call('/interact',{method:'POST',body:JSON.stringify({confirm:true})});toast(`完成：点赞 ${data.likes?.length||0} 条，评论 ${data.comments?.length||0} 条`);loadDashboard();refreshFeeds()}catch(error){toast(error.message,true)}finally{setBusy(btn,false)}}
$('refreshBtn').addEventListener('click',()=>refreshFeeds());$('personSelect').addEventListener('change',()=>{ $('personInput').value=''; refreshFeeds() });$('readPersonBtn').addEventListener('click',()=>{const value=$('personInput').value.trim();if(!/^\d{5,20}$/.test(value))return toast('请输入有效 QQ 号',true);refreshFeeds(value)});$('personInput').addEventListener('keydown',event=>{if(event.key==='Enter')$('readPersonBtn').click()});$('refreshFriendsBtn').addEventListener('click',async()=>{await loadDashboard();refreshFeeds()});$('generateBtn').addEventListener('click',generateDraft);$('postBtn').addEventListener('click',publish);$('saveSettingsBtn').addEventListener('click',saveSettings);$('autoPostNowBtn').addEventListener('click',autopostNow);$('interactNowBtn').addEventListener('click',interactNow);$('feeds').addEventListener('click',event=>{const like=event.target.closest('[data-like]');if(like)return likeFeed(Number(like.dataset.like),like);const comment=event.target.closest('[data-comment]');if(comment)return $(`comment-${comment.dataset.comment}`).classList.toggle('open');const send=event.target.closest('[data-send-comment]');if(send)return sendComment(Number(send.dataset.sendComment),send)});
loadDashboard().then(refreshFeeds);
  </script>
</body>
