[project]
name = "atri-qq-bot"
version = "0.5.0"
description = "A minimal OneBot/NapCat QQ companion bot with an Atri persona."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "imageio-ffmpeg>=0.5.1",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "Pillow>=10.0.0",
  "pypinyin>=0.53.0,<1.0",
  "pypdf>=4.0.0",
  "python-dotenv>=1.0.1",
  "rapidocr>=3.9.0,<4.0",
  "onnxruntime>=1.18.0,<2.0",
  "websockets>=14.0,<16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
insights = [
  "jieba>=0.42.1,<1.0",
  "sentence-transformers>=3.0.0,<6.0.0",
]

[project.scripts]
atri-qq-bot = "atri_qq_bot.__main__:main"
atri-voice-service = "atri_voice_service.server:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["atri_qq_bot*", "atri_webui*", "atri_shared*", "atri_voice_service*"]

[tool.setuptools]
py-modules = ["atri_runtime"]

