[project]
name = "atri-qq-bot"
version = "0.1.0"
description = "A minimal OneBot/NapCat QQ companion bot with an Atri persona."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "imageio-ffmpeg>=0.5.1",
  "Pillow>=10.0.0",
  "pypinyin>=0.53.0,<1.0",
  "pypdf>=4.0.0",
  "python-dotenv>=1.0.1",
  "rapidocr>=3.9.0,<4.0",
  "onnxruntime>=1.18.0,<2.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
music = [
  "numpy>=1.26.0,<3.0",
  "pedalboard>=0.9.24,<1.0",
  "scipy>=1.11.0,<2.0",
  "soundfile>=0.12.0,<1.0",
]

[project.gui-scripts]
atri-desktop-pet = "atri_desktop.app:main"

[project.scripts]
atri-voice-service = "atri_voice_service.server:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atri_desktop = ["assets/*.ico", "assets/*.png", "assets/expressions/*.png"]
